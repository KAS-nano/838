[graph]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error chega pela pilha GTK 3 do Tauri; sem substituição compatível disponível." },
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range chega por urlpattern/tauri-utils; advisory de manutenção, sem vulnerabilidade de execução." },
  { id = "RUSTSEC-2025-0080", reason = "unic-common chega por urlpattern/tauri-utils; advisory de manutenção, sem vulnerabilidade de execução." },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property chega por urlpattern/tauri-utils; advisory de manutenção, sem vulnerabilidade de execução." },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version chega por urlpattern/tauri-utils; advisory de manutenção, sem vulnerabilidade de execução." },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident chega por urlpattern/tauri-utils; advisory de manutenção, sem vulnerabilidade de execução." },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
  { crate = "openssl", reason = "Preferir a pilha TLS nativa/rustls e evitar dependência OpenSSL adicionada sem revisão." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
