name: Release metadata

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:versions
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Generate release checksums
        run: sha256sum sbom.cdx.json THIRD_PARTY_NOTICES.md package-lock.json apps/hardware-agent/src-tauri/Cargo.lock > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-metadata-${{ github.ref_name }}
          path: |
            sbom.cdx.json
            THIRD_PARTY_NOTICES.md
            SHA256SUMS
          retention-days: 90
