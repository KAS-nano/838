version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types: [patch, minor]
        exclude-patterns: [next, eslint-config-next, prisma, "@prisma/*", better-auth, "@better-auth/*"]
      next:
        patterns: [next, eslint-config-next]
      prisma:
        patterns: [prisma, "@prisma/*"]
      authentication:
        patterns: [better-auth, "@better-auth/*"]
    ignore:
      # eslint-config-next 16.3.5 and its plugins currently require ESLint 9.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # typescript-eslint 8.70.0 currently requires TypeScript below 6.1.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    versioning-strategy: increase

  - package-ecosystem: cargo
    directory: /apps/hardware-agent/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    groups:
      tauri:
        patterns: [tauri, tauri-build]
      rust-patch-and-minor:
        update-types: [patch, minor]
